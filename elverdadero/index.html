<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dante Zurlo</title>
  <meta name="description" content="Portfolio personal de Dante Zurlo, desarrollador web.">

  <link rel="icon" type="image/jpg" href="assets/images.jpg">

 
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <header class="navbar" id="navbar">
    <div class="navbarinner">
      <a href="#inicio" class="navbarbrand">GZ<span class="cursor"></span></a>

      <nav class="navbarlinks">
        <a href="#sobre-mi">Sobre mi</a>
        <a href="#proyectos">Proyectos</a>
        <a href="#contacto">Contacto</a>
      </nav>


    </div>
  </header>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <main>
    <section id="inicio" class="section bienvenida">
      <div class="sectioncard">
        <h1>Hola, soy Dante</h1>
        <p>Bienvenido a mi portfolio</p>
      </div>
    </section>

    <section id="sobre-mi" class="section sobremi">
      <div class="sectioncard">
        <h2>Sobre mi</h2>
        <p>Soy estudiante y desarrollador web.</p>
      </div>
    </section>

    <section id="proyectos" class="section proyectos">
  <div class="sectioncard sectioncard--wide">
    <h2>Mis proyectos</h2>
    <p>Estos son algunos de mis proyectos.</p>

    <div id="carouselExampleIndicators" class="carousel slide carousel-proyectos" data-bs-ride="carousel">

      <div class="carousel-indicators">
        <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
        <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1" aria-label="Slide 2"></button>
        <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2" aria-label="Slide 3"></button>
      </div>

      <div class="carousel-inner">
        <div class="carousel-item active">
           <a href="https://github.com/Dantelz/save-obama-wishlist-on-steam" target="_blank" rel="noopener" class="project-slideshow">
            <img src="assets/obamamenu.jpg" alt="Save Obama Menu" style="animation-delay: 0s;">
            <img src="assets/obamacaptura1.jpg" alt="Save Obama Gameplay" style="animation-delay: 3s;">
            <img src="assets/obamacaptura2.jpg" alt="Save Obama Gameplay" style="animation-delay: 6s;">
        </div>
        <div class="carousel-item">
          <a href="https://github.com/tu-usuario/proyecto-2" target="_blank" rel="noopener" class="project-slideshow">
            <img src="assets/proyecto2-foto1.jpg" alt="Proyecto 2 - captura 1" style="animation-delay: 0s;">
            <img src="assets/proyecto2-foto2.jpg" alt="Proyecto 2 - captura 2" style="animation-delay: 3s;">
            <img src="assets/proyecto2-foto3.jpg" alt="Proyecto 2 - captura 3" style="animation-delay: 6s;">
        </div>
        <div class="carousel-item">
          <a href="https://github.com/tu-usuario/proyecto-3" target="_blank" rel="noopener" class="project-slideshow">
            <img src="assets/proyecto3-foto1.jpg" alt="Proyecto 3 - captura 1" style="animation-delay: 0s;">
            <img src="assets/proyecto3-foto2.jpg" alt="Proyecto 3 - captura 2" style="animation-delay: 3s;">
            <img src="assets/proyecto3-foto3.jpg" alt="Proyecto 3 - captura 3" style="animation-delay: 6s;">
          </a>
        </div>
      </div>

      <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Anterior</span>
      </button>

      <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Siguiente</span>
      </button>

    </div>
  </div>
</section>

    <section id="contacto" class="section contacto">
      <div class="sectioncard">
        <h2>Contacto</h2>
        <p>Estoy disponible para nuevos proyectos.</p>
      </div>
    </section>
  </main>
</body>
